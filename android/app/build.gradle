plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

// Release CI overrides these via env vars; local builds fall back to the
// checked-in defaults. VERSION_CODE must increase for every Play upload, so CI
// derives it from the git commit count.
def releaseVersionCode = (System.getenv("VERSION_CODE") ?: "3").toInteger()
def releaseVersionName = System.getenv("VERSION_NAME") ?: "1.1"

android {
    namespace 'com.juggling.tracker'
    compileSdk 36
    // Pinned so AGP finds (or installs) the NDK it needs to strip Compose's
    // .so and extract its symbol table for Play; without an NDK the release
    // bundle silently ships without debug symbols.
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "com.juggling.tracker"
        minSdk 24
        targetSdk 36
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Populated only when the signing secrets are present (CI, or a
            // local release build with the env vars set). Debug builds and
            // unsigned assembleRelease runs skip this untouched.
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Bundles the native libraries' symbol tables (Compose ships a
            // small .so) so Play can symbolicate native crashes and ANRs and
            // stops warning that no debug symbols were uploaded.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            if (System.getenv("KEYSTORE_FILE")?.isEmpty() == false) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        // Robolectric needs the real merged resources and manifest to inflate
        // anything; without this the Compose tests cannot resolve R.string.
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    // Catch detector, Regularity and the watch-phone protocol, in ../shared.
    implementation project(':shared')

    // Garmin Connect IQ Mobile SDK for Android, published on Maven Central.
    implementation "com.garmin.connectiq:ciq-companion-app-sdk:2.4.0@aar"

    // Wear OS Data Layer, for the Wear OS watch app in ../wearos.
    implementation "com.google.android.gms:play-services-wearable:19.0.0"

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.10.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2025.02.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.14.1')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'org.json:json:20231013'

    // Compose UI tests. Robolectric runs them on the JVM as part of
    // testDebugUnitTest, so they run in CI on every pull request; an
    // instrumented androidTest suite would need an emulator the CI runner does
    // not have. ui-test-manifest supplies the empty activity the test host
    // composes into and is already a debugImplementation above.
    testImplementation composeBom
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'org.robolectric:robolectric:4.15.1'

    // Instrumented tests, for the cases that need a real device rather than a
    // shadowed framework. Run with `./gradlew connectedDebugAndroidTest`.
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
