name: Apple

# Checks for the iPhone and Apple Watch apps in apple/. Runs on every pull
# request and on main after merge whenever something the Apple apps build from
# or replay has changed, and from the Actions tab (Run workflow) on any branch.
# It also runs when the code JugglingCore is ported from changes (the Kotlin
# shared/ module and the Garmin detector and Regularity score), so a change
# made there and not yet ported shows up as a failing JugglingCore test rather
# than as drift. The main CI (ci.yml) does not look at apple/.
on:
  push:
    branches: [main]
    paths:
      - 'apple/**'
      - 'shared/**'
      - 'connectiq/source/JugglingDetector.mc'
      - 'connectiq/source/ShapeConsistency.mc'
      - 'connectiq/data/**'
      - 'connectiq/scenarios/**'
      - 'simulation/test_detection.py'
      - '.github/workflows/apple.yml'
      - '.github/scripts/check-apple-archive.sh'
  pull_request:
    paths:
      - 'apple/**'
      - 'shared/**'
      - 'connectiq/source/JugglingDetector.mc'
      - 'connectiq/source/ShapeConsistency.mc'
      - 'connectiq/data/**'
      - 'connectiq/scenarios/**'
      - 'simulation/test_detection.py'
      - '.github/workflows/apple.yml'
      - '.github/scripts/check-apple-archive.sh'
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: JugglingCore tests
    runs-on: macos-latest
    steps:
      - name: Check out
        # Full checkout: the tests replay the recordings in connectiq/data and
        # read the pinned counts from simulation/test_detection.py.
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Swift package tests
        working-directory: apple/JugglingCore
        run: swift test

  watch:
    name: Apple Watch app
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Watch logic tests
        # Juggle mode, Record mode and the start-up screens, with fake timers
        # and a fake phone link.
        working-directory: apple/WatchLogic
        run: swift test

      - name: Generate the Xcode project
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the watch simulator
        # No signing: there is no paid Apple developer account, and the
        # simulator does not need one.
        working-directory: apple
        run: |
          xcodebuild build \
            -project JugglingTracker.xcodeproj \
            -scheme JugglingTrackerWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

  iphone:
    name: iPhone app
    runs-on: macos-latest
    steps:
      - name: Check out
        # Full checkout: the app's tests replay recordings from connectiq/data.
        uses: actions/checkout@v7

      - name: Generate the Xcode project
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          # The newest iOS runtime's first iPhone; runner images change their
          # device list, so no model is hard-coded.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          for runtime in reversed(runtimes):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"])
                  break
          ')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild test \
            -project JugglingTracker.xcodeproj \
            -scheme JugglingTracker \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: .*JugglingTracker/|Test Case .* (passed|failed)|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-xcodebuild-log
          path: apple/xcodebuild.log

  release-check:
    name: App Store archive
    # Archives the iPhone app the way release-apple.yml does, but unsigned, and
    # checks the archive for what App Store Connect would reject. Catches a
    # missing icon or privacy manifest without a paid Apple developer account.
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Generate the Xcode project
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive without signing
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild archive \
            -project JugglingTracker.xcodeproj \
            -scheme JugglingTracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/JugglingTracker.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log

      - name: Check the archive
        run: .github/scripts/check-apple-archive.sh "$RUNNER_TEMP/JugglingTracker.xcarchive"
