name: Promote Play release

# Copies the current internal-testing release to another Play track (by
# default the closed testing track), for the phone app. The Wear OS app is a
# side development stream and is no longer released. Run it by hand from the
# Actions tab. Google reviews closed and
# production releases before testers see them. Uses the same
# PLAY_SERVICE_ACCOUNT_JSON secret as release-android.yml.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Phone track to promote to
        default: ClosedTestingTrack

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Google auth
        run: pip install google-auth requests

      - name: Promote phone app
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
        run: python .github/scripts/promote_play_release.py com.juggling.tracker internal "$TRACK"
