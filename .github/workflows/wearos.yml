name: Wear OS

# The Wear OS watch app is a side development stream: it is not tested on
# every push or pull request and gets no further releases. Run this by hand
# from the Actions tab (Run workflow, then pick the branch) when Wear OS code
# changes or before relying on the Wear OS app. The main CI (ci.yml) covers
# the Android phone app, the shared detector module and the detection tests.
on:
  workflow_dispatch:

concurrency:
  group: wearos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Wear OS checks are three jobs that run side by side rather than one
  # after another: unit tests and lint, the minified release bundle, and the
  # emulator tests. As a single job they took about six minutes; split, the
  # run waits only for the slowest of them (the emulator).
  #
  # setup-gradle caches Gradle's dependencies and, with --build-cache, task
  # outputs: a run on main writes the cache and runs on other branches read
  # it, so code a branch does not touch is not recompiled.
  wearos:
    name: Wear OS tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        # Full checkout: the app builds in ../shared, and the tests replay the
        # recordings in connectiq/data/.
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric framework jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-wear-${{ runner.os }}-${{ hashFiles('wearos/app/build.gradle') }}
          restore-keys: |
            robolectric-wear-${{ runner.os }}-

      - name: Unit and Robolectric UI tests
        working-directory: wearos
        run: ./gradlew --build-cache testDebugUnitTest

      - name: Lint
        working-directory: wearos
        if: ${{ !cancelled() }}
        run: ./gradlew --build-cache :app:lintDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wearos-reports
          path: |
            wearos/app/build/reports/
          if-no-files-found: ignore

  wearos-release:
    name: Wear OS release build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Release bundle builds (minified, unsigned)
        # The Play release uploads this bundle, so R8 problems show up here
        # rather than on release day.
        working-directory: wearos
        run: ./gradlew --build-cache bundleRelease

      - name: Native debug symbols zip builds
        # The release workflow uploads this to Play alongside the bundle.
        run: .github/scripts/native-debug-symbols.sh wearos

  wearos-emulator:
    name: Wear OS emulator tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build app and test APKs
        # Built before the emulator starts so the build does not compete with
        # the booting emulator for the runner's CPUs.
        working-directory: wearos
        run: ./gradlew --build-cache assembleDebug assembleDebugAndroidTest

      - name: Cache Wear OS system image
        # sdkmanager otherwise downloads the ~1 GB image on every run.
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-30/android-wear/x86
          key: wear-system-image-${{ runner.os }}-30-x86

      - name: Enable KVM
        # Hosted Linux runners support hardware acceleration once the device
        # node is opened up; without it the emulator will not boot in time.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on a Wear OS emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-wear
          arch: x86
          profile: wearos_large_round
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: wearos
          # The APKs are already built, so the tests would otherwise start
          # seconds after boot, while system windows still take focus away
          # from the app (see the script). Before the build moved out of this
          # step, compiling here gave the emulator that time to settle.
          script: |
            ../.github/scripts/wait_for_emulator_idle.sh
            ./gradlew --build-cache connectedDebugAndroidTest
            adb pull /data/local/tmp/wear-screens app/build/wear-screens || true

      - name: Upload emulator screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wear-emulator-screenshots
          path: wearos/app/build/wear-screens/
          if-no-files-found: ignore

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wearos-emulator-reports
          path: |
            wearos/app/build/reports/
            wearos/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

