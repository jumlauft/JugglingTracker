# The Xcode project for the iPhone and Apple Watch apps, as an XcodeGen spec.
# The .xcodeproj is generated from it and not committed, so the two apps can
# be worked on side by side without conflicts in project.pbxproj:
#
#   brew install xcodegen
#   cd apple && xcodegen generate && open JugglingTracker.xcodeproj
#
# Each app is one block under `targets`. The iPhone app embeds the watch app
# as its companion.
name: JugglingTracker
options:
  bundleIdPrefix: com.juggling
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # No paid Apple developer account: simulator builds and local installs only.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
packages:
  JugglingCore:
    path: JugglingCore
  WatchLogic:
    path: WatchLogic
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
  # Garmin's Connect IQ Mobile SDK, for the link to the Garmin watch app.
  # A binary framework under Garmin's Connect IQ SDK license
  # (developer.garmin.com/connect-iq/sdk), fetched by Xcode, not kept here.
  ConnectIQ:
    url: https://github.com/garmin/connectiq-companion-app-sdk-ios
    exactVersion: 1.8.0
targets:
  # The iPhone app (the Android phone app for iOS).
  JugglingTracker:
    type: application
    platform: iOS
    sources:
      - path: JugglingTracker
        excludes:
          - "**/README.md"
    dependencies:
      - package: JugglingCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: ConnectIQ
      # Embeds the watch app, so installing the iPhone app offers it on a
      # paired Apple Watch.
      - target: JugglingTrackerWatch
    info:
      path: JugglingTracker/App/Info.plist
      properties:
        CFBundleDisplayName: Juggling Tracker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The weekly backup (SessionBackup) runs as a background refresh.
        # bluetooth-central lets the Garmin watch's messages reach the app
        # while it is in the background.
        UIBackgroundModes:
          - fetch
          - bluetooth-central
        # Connect IQ: Garmin Connect returns the chosen watches through this
        # URL scheme (GarminLink.urlScheme), and the SDK checks for Garmin
        # Connect through gcm-ciq.
        CFBundleURLTypes:
          - CFBundleURLName: com.juggling.tracker.connectiq
            CFBundleURLSchemes:
              - jugglingtracker-ciq
        LSApplicationQueriesSchemes:
          - gcm-ciq
        NSBluetoothAlwaysUsageDescription: Juggling Tracker uses Bluetooth to receive your sessions and recordings from your Garmin watch.
        NSBluetoothPeripheralUsageDescription: Juggling Tracker uses Bluetooth to receive your sessions and recordings from your Garmin watch.
        BGTaskSchedulerPermittedIdentifiers:
          - com.juggling.tracker.backup
        # The app's Documents folder shows up in the Files app, so recordings
        # and exports can be picked up from there too.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        # Firebase starts only when the user allows it (Settings > Privacy).
        FirebaseAutomaticScreenReportingEnabled: false
        FirebaseCrashlyticsCollectionEnabled: false
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juggling.tracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        # The Connect IQ SDK uses Objective-C categories.
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
  JugglingTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JugglingTrackerTests
    dependencies:
      # Hosted in the app: @testable import JugglingTracker reaches its
      # code, and JugglingCore comes along with it.
      - target: JugglingTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juggling.tracker.tests
        GENERATE_INFOPLIST_FILE: true
  # The Apple Watch app (the Garmin watch app for watchOS). Single-target
  # watchOS app; the iPhone app embeds it as its companion.
  JugglingTrackerWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - Info.plist
          - "*.entitlements"
          - README.md
    dependencies:
      - package: WatchLogic
      - package: JugglingCore
      - sdk: HealthKit.framework
      - sdk: CoreMotion.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juggling.tracker.watchkitapp
        PRODUCT_NAME: JugglingTrackerWatch
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/JugglingTrackerWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
    scheme: {}
schemes:
  JugglingTracker:
    build:
      targets:
        JugglingTracker: all
        JugglingTrackerTests: [test]
    test:
      targets:
        - JugglingTrackerTests
