# The Xcode project for the iPhone app (and, once it lands, the Apple Watch
# app). XcodeGen turns this file into JugglingTracker.xcodeproj, which is not
# checked in:
#
#   brew install xcodegen
#   cd apple && xcodegen generate && open JugglingTracker.xcodeproj
#
# Each app is one block under `targets`, so the iPhone and watch work can each
# add theirs without touching the other's.
name: JugglingTracker
options:
  bundleIdPrefix: com.juggling
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # No paid Apple developer account: simulator builds and local installs only.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
packages:
  JugglingCore:
    path: JugglingCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
targets:
  JugglingTracker:
    type: application
    platform: iOS
    sources:
      - path: JugglingTracker
        excludes:
          - "**/README.md"
    dependencies:
      - package: JugglingCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
    info:
      path: JugglingTracker/App/Info.plist
      properties:
        CFBundleDisplayName: Juggling Tracker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The weekly backup (SessionBackup) runs as a background refresh.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.juggling.tracker.backup
        # The app's Documents folder shows up in the Files app, so recordings
        # and exports can be picked up from there too.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        # Firebase starts only when the user allows it (Settings > Privacy).
        FirebaseAutomaticScreenReportingEnabled: false
        FirebaseCrashlyticsCollectionEnabled: false
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juggling.tracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
  JugglingTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JugglingTrackerTests
    dependencies:
      # Hosted in the app: @testable import JugglingTracker reaches its
      # code, and JugglingCore comes along with it.
      - target: JugglingTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juggling.tracker.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  JugglingTracker:
    build:
      targets:
        JugglingTracker: all
        JugglingTrackerTests: [test]
    test:
      targets:
        - JugglingTrackerTests
