# The Xcode project for the iPhone and Apple Watch apps, as an XcodeGen spec.
# The .xcodeproj is generated from it and not committed, so the two apps can
# be worked on side by side without conflicts in project.pbxproj:
#
#   brew install xcodegen
#   cd apple && xcodegen generate && open JugglingTracker.xcodeproj
#
# Each app is one entry under targets.
name: JugglingTracker
options:
  bundleIdPrefix: com.juggling
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  JugglingCore:
    path: JugglingCore
  WatchLogic:
    path: WatchLogic
targets:
  # The Apple Watch app (the Garmin watch app for watchOS). Single-target
  # watchOS app; the iPhone app embeds it as its companion.
  JugglingTrackerWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - Info.plist
          - "*.entitlements"
          - README.md
    dependencies:
      - package: WatchLogic
      - package: JugglingCore
      - sdk: HealthKit.framework
      - sdk: CoreMotion.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juggling.tracker.watchkitapp
        PRODUCT_NAME: JugglingTrackerWatch
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/JugglingTrackerWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
    scheme: {}
